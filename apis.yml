aid: parafi
name: Parafi
description: >-
  ParaFi is a blockchain and digital-asset investment firm (ParaFi Capital) whose technology
  division, ParaFi Tech (parafi.tech), operates staking validators across Solana, Ethereum,
  Avalanche, and Aptos and publishes a free, public, read-only REST API for on-chain staking
  and network data. The ParaFi Tech API (OpenAPI 3.0.3, 23 GET operations, no authentication)
  serves validator APY/APR and MEV contribution, Solana delegator rewards by staker/validator/epoch,
  active-stake and delegator breakdowns, real-time and historical network health (TPS, block time,
  compute units, leader slots), Ethereum and Avalanche network stats, and CoinGecko-backed token
  prices. It is explicitly designed for dashboards, AI agents, and programmatic integrations,
  shipping llms.txt, an extended llms-full.txt, and a skill.md agent guide alongside the OpenAPI.
